{% extends "layouts/base.html" %}

{% block title %}{{ page_title }}{% endblock title %}

{% block content %}
<div class="card">
    <h1>{{ heading }}</h1>
    <p>{{ description }}</p>
    <form method="post" action="">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>
        {{ form.non_field_errors }}
        <button type="submit">{{ submit_label }}</button>
        <a href="{% url cancel_url_name %}">Cancel</a>
    </form>
</div>
{% endblock content %}
